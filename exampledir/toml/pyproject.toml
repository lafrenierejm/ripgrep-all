[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
"Bug Tracker" = "https://example.com/issues"

[tool.ruff]
line-length = 100
select = ["E", "F"]

[tool.ruff.per-file-ignores]
"tests/*" = ["E501"]
